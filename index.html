<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bubot - Mi Casita de Sueños</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #87CEEB;
    --sky-light: #C8E6F5;
    --yellow: #F5C842;
    --yellow-dark: #E0B020;
    --blue-dark: #1565C0;
    --blue-mid: #1976D2;
    --brown: #8B5E3C;
    --cream: #FFF8E7;
    --bubble-user: #1976D2;
    --bubble-bot: #ffffff;
    --text-dark: #2C3E50;
    --shadow: 0 4px 20px rgba(0,0,0,0.12);
  }

- { box-sizing: border-box; margin: 0; padding: 0; }

body {
font-family: ‘Nunito’, sans-serif;
background: linear-gradient(160deg, #87CEEB 0%, #C8E6F5 50%, #E8F4FD 100%);
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 16px;
}

/* Floating clouds background */
body::before {
content: ‘☁️ ☁️ ☁️’;
font-size: 3rem;
position: fixed;
top: 20px;
left: 0;
right: 0;
text-align: center;
opacity: 0.2;
pointer-events: none;
letter-spacing: 80px;
animation: floatClouds 20s infinite linear;
}

@keyframes floatClouds {
0% { transform: translateX(-50px); }
50% { transform: translateX(50px); }
100% { transform: translateX(-50px); }
}

.app-container {
width: 100%;
max-width: 420px;
background: white;
border-radius: 28px;
overflow: hidden;
box-shadow: 0 8px 40px rgba(0,0,0,0.18);
display: flex;
flex-direction: column;
height: 90vh;
max-height: 780px;
position: relative;
}

/* Header */
.header {
background: linear-gradient(135deg, #87CEEB, #64B5E8);
padding: 14px 20px 0;
text-align: center;
position: relative;
flex-shrink: 0;
}

.logo-row {
display: flex;
align-items: center;
justify-content: space-between;
margin-bottom: 8px;
}

.logo-text {
font-family: ‘Fredoka One’, cursive;
font-size: 1rem;
color: var(–blue-dark);
line-height: 1.2;
text-align: left;
}

.logo-icon {
width: 32px;
height: 32px;
margin-right: 8px;
}

.logo-left {
display: flex;
align-items: center;
}

.menu-btn {
background: none;
border: none;
cursor: pointer;
font-size: 1.4rem;
color: var(–blue-dark);
}

.bubot-avatar-wrapper {
display: flex;
justify-content: center;
position: relative;
}

.bubot-circle {
width: 110px;
height: 110px;
background: rgba(255,255,255,0.85);
border-radius: 50%;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
box-shadow: 0 4px 16px rgba(0,0,0,0.12);
border: 3px solid white;
}

.bubot-circle img {
width: 100%;
height: 100%;
object-fit: cover;
}

.status-dot {
position: absolute;
bottom: 6px;
right: calc(50% - 58px);
width: 14px;
height: 14px;
background: #4CAF50;
border-radius: 50%;
border: 2px solid white;
animation: pulse 2s infinite;
}

@keyframes pulse {
0%, 100% { box-shadow: 0 0 0 0 rgba(76,175,80,0.4); }
50% { box-shadow: 0 0 0 6px rgba(76,175,80,0); }
}

.header-name {
font-family: ‘Fredoka One’, cursive;
font-size: 1.4rem;
color: var(–blue-dark);
margin-top: 6px;
}

.header-sub {
font-size: 0.78rem;
color: #1976D2;
font-weight: 600;
margin-bottom: 10px;
opacity: 0.85;
}

/* Yellow band */
.yellow-band {
height: 16px;
background: var(–yellow);
flex-shrink: 0;
}

/* API Key setup */
.setup-panel {
background: #FFF8E7;
border-bottom: 2px dashed #F5C842;
padding: 12px 20px;
flex-shrink: 0;
}

.setup-panel.hidden { display: none; }

.setup-label {
font-size: 0.75rem;
font-weight: 800;
color: var(–blue-dark);
margin-bottom: 6px;
display: flex;
align-items: center;
gap: 6px;
}

.setup-row {
display: flex;
gap: 8px;
}

.setup-row input {
flex: 1;
border: 2px solid #F5C842;
border-radius: 12px;
padding: 8px 12px;
font-family: ‘Nunito’, sans-serif;
font-size: 0.78rem;
outline: none;
background: white;
color: var(–text-dark);
}

.setup-row input:focus { border-color: var(–blue-mid); }

.setup-btn {
background: var(–yellow);
border: none;
border-radius: 12px;
padding: 8px 14px;
font-family: ‘Fredoka One’, cursive;
font-size: 0.85rem;
color: var(–blue-dark);
cursor: pointer;
transition: transform 0.15s, background 0.15s;
}

.setup-btn:hover { background: var(–yellow-dark); transform: scale(1.04); }

.api-info {
font-size: 0.68rem;
color: #888;
margin-top: 4px;
}

/* Messages area */
.messages {
flex: 1;
overflow-y: auto;
padding: 16px;
display: flex;
flex-direction: column;
gap: 12px;
background: linear-gradient(180deg, #EAF5FB 0%, #F7FAFE 100%);
}

.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-track { background: transparent; }
.messages::-webkit-scrollbar-thumb { background: #B0D4F1; border-radius: 4px; }

/* Message bubbles */
.message-row {
display: flex;
align-items: flex-end;
gap: 8px;
animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes popIn {
from { opacity: 0; transform: translateY(10px) scale(0.95); }
to { opacity: 1; transform: translateY(0) scale(1); }
}

.message-row.user { flex-direction: row-reverse; }

.msg-avatar {
width: 32px;
height: 32px;
border-radius: 50%;
overflow: hidden;
flex-shrink: 0;
border: 2px solid white;
box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg-avatar.user-av { background: var(–blue-mid); display: flex; align-items: center; justify-content: center; font-size: 1rem; }

.bubble {
max-width: 75%;
padding: 10px 14px;
border-radius: 18px;
font-size: 0.88rem;
line-height: 1.5;
box-shadow: 0 2px 8px rgba(0,0,0,0.08);
word-break: break-word;
}

.bubble.bot {
background: white;
color: var(–text-dark);
border-bottom-left-radius: 4px;
font-weight: 600;
}

.bubble.user {
background: var(–blue-mid);
color: white;
border-bottom-right-radius: 4px;
font-weight: 700;
}

/* Typing indicator */
.typing-row { display: flex; align-items: flex-end; gap: 8px; }
.typing-bubble {
background: white;
border-radius: 18px;
border-bottom-left-radius: 4px;
padding: 12px 16px;
box-shadow: 0 2px 8px rgba(0,0,0,0.08);
display: flex;
gap: 5px;
align-items: center;
}

.dot {
width: 8px; height: 8px;
background: #B0D4F1;
border-radius: 50%;
animation: bounce 1.2s infinite;
}
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
0%, 80%, 100% { transform: translateY(0); background: #B0D4F1; }
40% { transform: translateY(-6px); background: var(–blue-mid); }
}

/* Quick replies */
.quick-replies {
display: flex;
flex-wrap: wrap;
gap: 6px;
padding: 0 16px 8px;
flex-shrink: 0;
background: #F7FAFE;
}

.quick-chip {
background: white;
border: 2px solid #B0D4F1;
border-radius: 20px;
padding: 5px 12px;
font-family: ‘Nunito’, sans-serif;
font-size: 0.75rem;
font-weight: 700;
color: var(–blue-mid);
cursor: pointer;
transition: all 0.2s;
white-space: nowrap;
}

.quick-chip:hover {
background: var(–blue-mid);
color: white;
border-color: var(–blue-mid);
transform: translateY(-2px);
}

/* Input area */
.input-area {
background: white;
padding: 12px 16px 16px;
border-top: 2px solid #E8F4FD;
flex-shrink: 0;
}

.input-row {
display: flex;
gap: 10px;
align-items: center;
}

.chat-input {
flex: 1;
background: #EAF5FB;
border: 2px solid #B0D4F1;
border-radius: 24px;
padding: 10px 16px;
font-family: ‘Nunito’, sans-serif;
font-size: 0.9rem;
font-weight: 600;
color: var(–text-dark);
outline: none;
transition: border-color 0.2s;
}

.chat-input:focus { border-color: var(–blue-mid); background: white; }
.chat-input::placeholder { color: #A0C4E0; }

.send-btn {
width: 44px;
height: 44px;
background: var(–yellow);
border: none;
border-radius: 50%;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
font-size: 1.2rem;
transition: transform 0.2s, background 0.2s;
box-shadow: 0 3px 10px rgba(245,200,66,0.4);
flex-shrink: 0;
}

.send-btn:hover { transform: scale(1.1) rotate(-5deg); background: var(–yellow-dark); }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Footer nav */
.footer-nav {
background: white;
border-top: 1px solid #E8F4FD;
padding: 8px 0 10px;
display: flex;
justify-content: center;
gap: 40px;
flex-shrink: 0;
}

.nav-btn {
background: none;
border: none;
font-size: 1.3rem;
cursor: pointer;
opacity: 0.5;
transition: opacity 0.2s, transform 0.2s;
}

.nav-btn:hover { opacity: 1; transform: scale(1.2); }
.nav-btn.active { opacity: 1; }

/* User selector */
.user-selector {
display: flex;
justify-content: center;
gap: 8px;
padding: 8px 16px;
background: #F7FAFE;
border-bottom: 1px solid #E8F4FD;
flex-shrink: 0;
}

.user-tag {
padding: 4px 12px;
border-radius: 20px;
border: 2px solid #B0D4F1;
font-size: 0.72rem;
font-weight: 800;
color: #1976D2;
cursor: pointer;
background: white;
transition: all 0.2s;
}

.user-tag.active, .user-tag:hover {
background: var(–blue-mid);
color: white;
border-color: var(–blue-mid);
}

.footer-text {
font-size: 0.6rem;
color: #A0C4E0;
text-align: center;
padding: 2px 0 6px;
background: white;
font-weight: 600;
}
</style>

</head>

<script>
  // ─── State ───────────────────────────────────────────────
  let apiKey = localStorage.getItem('bubot_api_key') || '';
  let userType = 'niño';
  let conversationHistory = [];
  let isTyping = false;

  // ─── Bubot image (inline base64 placeholder owl emoji fallback) ──
  // We use the uploaded image via a trick — set a data URL
  // Since we can't embed the real file in a standalone HTML for download,
  // we use a cute SVG owl as fallback that matches Bubot's colors
  const bubotSVG = `data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
    <circle cx='50' cy='50' r='45' fill='%23D4956A'/>
    <ellipse cx='50' cy='55' rx='30' ry='32' fill='%23E8B48A'/>
    <circle cx='35' cy='42' r='14' fill='white'/>
    <circle cx='65' cy='42' r='14' fill='white'/>
    <circle cx='35' cy='43' r='9' fill='%232C3E50'/>
    <circle cx='65' cy='43' r='9' fill='%232C3E50'/>
    <circle cx='38' cy='40' r='3' fill='white'/>
    <circle cx='68' cy='40' r='3' fill='white'/>
    <ellipse cx='50' cy='56' rx='8' ry='6' fill='%23F5A623'/>
    <polygon points='50,56 45,62 55,62' fill='%23E8960A'/>
    <!-- headphones -->
    <path d='M20,42 Q20,18 50,18 Q80,18 80,42' stroke='%231A1A2E' stroke-width='5' fill='none' stroke-linecap='round'/>
    <rect x='14' y='38' width='12' height='16' rx='6' fill='%231A1A2E'/>
    <rect x='74' y='38' width='12' height='16' rx='6' fill='%231A1A2E'/>
    <rect x='16' y='40' width='8' height='12' rx='4' fill='%234A4A6A'/>
    <rect x='76' y='40' width='8' height='12' rx='4' fill='%234A4A6A'/>
  </svg>`;

  document.getElementById('bubot-img').src = bubotSVG;

  // ─── System prompts by user type ─────────────────────────
  const systemPrompts = {
    niño: `Eres Bubot, un búho amigable y divertido que es el asistente de la app "Mi Casita de Sueños" para niños. 
Tu personalidad es: alegre, paciente, usa emojis lindos, habla de forma simple y clara para niños de 6-12 años, 
usa palabras fáciles, motiva siempre positivamente. 
La app Mi Casita de Sueños ayuda a niños a aprender sobre el hogar, familia, y sueños. 
Responde siempre en español. Sé muy breve y usa emojis. Máximo 3 oraciones por respuesta.`,

    tutor: `Eres Bubot, el asistente inteligente de "Mi Casita de Sueños". 
Estás hablando con un TUTOR o PADRE DE FAMILIA. 
Tu tono es: amable, informativo, profesional pero cálido. 
Puedes explicar características de la app, responder preguntas sobre el progreso de los niños, 
dar consejos de acompañamiento en casa. 
La app ayuda a niños a desarrollar habilidades del hogar y valores familiares. 
Responde en español de forma clara y útil.`,

    profesor: `Eres Bubot, el asistente pedagógico de "Mi Casita de Sueños". 
Estás hablando con un PROFESOR o EDUCADOR. 
Tu tono es: profesional, propositivo, con enfoque pedagógico. 
Puedes hablar sobre cómo integrar la app en el aula, objetivos de aprendizaje, 
reportes de avance de estudiantes, y estrategias didácticas. 
La app tiene módulos de aprendizaje sobre el hogar, familia y valores. 
Responde en español con enfoque educativo.`
  };

  // ─── Init ─────────────────────────────────────────────────
  window.onload = () => {
    if (apiKey) {
      document.getElementById('setup-panel').classList.add('hidden');
      showWelcome();
    } else {
      showWelcome();
    }
  };

  function showWelcome() {
    const welcomes = {
      niño: '¡Hola! 🦉✨ ¡Soy Bubot, tu búho de la suerte! Tengo mis audífonos listos para escucharte. ¿Quieres jugar o contarme algo hoy? 🏠💛',
      tutor: '¡Bienvenido! 🦉 Soy Bubot, el asistente de Mi Casita de Sueños. Estoy aquí para ayudarte a entender mejor la app y apoyar el aprendizaje de tus pequeños. ¿En qué puedo ayudarte?',
      profesor: '¡Bienvenido, educador! 🦉📚 Soy Bubot, el asistente pedagógico de Mi Casita de Sueños. Puedo ayudarte a integrar la app en tu práctica docente. ¿Qué necesitas saber?'
    };
    addMessage('bot', welcomes[userType]);
  }

  // ─── API Key ──────────────────────────────────────────────
  function saveApiKey() {
    const key = document.getElementById('api-key-input').value.trim();
    if (!key.startsWith('sk-ant')) {
      alert('La key debe empezar con sk-ant-...');
      return;
    }
    apiKey = key;
    localStorage.setItem('bubot_api_key', key);
    document.getElementById('setup-panel').classList.add('hidden');
    addMessage('bot', '🎉 ¡Listo! ¡Ya estoy activado! ¿En qué te puedo ayudar hoy?');
  }

  // ─── User type ────────────────────────────────────────────
  function setUser(btn, type) {
    document.querySelectorAll('.user-tag').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    userType = type;
    conversationHistory = [];
    document.getElementById('messages').innerHTML = '';

    const chips = {
      niño: ['¿Qué puedes hacer?', '¡Quiero jugar!', 'Cuéntame un cuento', '¿Cómo funciona la app?'],
      tutor: ['¿Cómo ayuda la app?', 'Ver progreso de mi hijo', 'Consejos para casa', 'Contactar soporte'],
      profesor: ['Objetivos pedagógicos', 'Integrar en el aula', 'Reportes de alumnos', 'Materiales didácticos']
    };

    const qr = document.getElementById('quick-replies');
    qr.innerHTML = chips[type].map(c => `<button class="quick-chip" onclick="sendQuick(this)">${c}</button>`).join('');

    showWelcome();
  }

  // ─── Quick reply ──────────────────────────────────────────
  function sendQuick(btn) {
    document.getElementById('chat-input').value = btn.textContent;
    sendMessage();
  }

  // ─── Add message to UI ────────────────────────────────────
  function addMessage(role, text) {
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = `message-row ${role === 'user' ? 'user' : ''}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';

    if (role === 'bot') {
      avatar.innerHTML = `<img src="${bubotSVG}" alt="Bubot">`;
    } else {
      avatar.classList.add('user-av');
      avatar.textContent = userType === 'niño' ? '🧒' : userType === 'tutor' ? '👨‍👩‍👧' : '👩‍🏫';
    }

    const bubble = document.createElement('div');
    bubble.className = `bubble ${role}`;
    bubble.textContent = text;

    row.appendChild(avatar);
    row.appendChild(bubble);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  // ─── Typing indicator ─────────────────────────────────────
  function showTyping() {
    const msgs = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'typing-row';
    row.id = 'typing-indicator';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.innerHTML = `<img src="${bubotSVG}" alt="Bubot">`;

    const bubble = document.createElement('div');
    bubble.className = 'typing-bubble';
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';

    row.appendChild(avatar);
    row.appendChild(bubble);
    msgs.appendChild(row);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  // ─── Send message ─────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || isTyping) return;

    if (!apiKey) {
      addMessage('bot', '🔑 ¡Necesito una API Key para poder responderte! Ingresa tu key arriba.');
      return;
    }

    input.value = '';
    addMessage('user', text);
    conversationHistory.push({ role: 'user', content: text });

    isTyping = true;
    document.getElementById('send-btn').disabled = true;
    showTyping();

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 300,
          system: systemPrompts[userType],
          messages: conversationHistory
        })
      });

      const data = await response.json();

      if (data.error) {
        throw new Error(data.error.message);
      }

      const reply = data.content[0].text;
      conversationHistory.push({ role: 'assistant', content: reply });

      hideTyping();
      addMessage('bot', reply);

    } catch (err) {
      hideTyping();
      if (err.message && err.message.includes('quota')) {
        addMessage('bot', '😴 Estoy un poquito cansado ahora. ¡Intenta en unos minutos!');
      } else if (err.message && err.message.includes('401')) {
        addMessage('bot', '🔑 Esa key no es válida. ¿Puedes revisar que esté bien escrita?');
        document.getElementById('setup-panel').classList.remove('hidden');
      } else {
        addMessage('bot', '🦉 ¡Ups! Algo salió mal. Intenta de nuevo.');
      }
      console.error(err);
    } finally {
      isTyping = false;
      document.getElementById('send-btn').disabled = false;
    }
  }
</script>

</body>
</html>
